server {
    listen 80;
    server_name localhost;
    # Cinco documentos de 5 MiB más el sobrecoste del formulario multipart.
    client_max_body_size 26m;
    error_page 413 = @carga_excesiva;

    location @carga_excesiva {
        default_type application/json;
        return 413 '{"error":"La carga supera el límite total de 26 MB. Adjunta hasta cinco documentos de 5 MB cada uno."}';
    }

    location = /health {
        proxy_pass http://backend:3000/health;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

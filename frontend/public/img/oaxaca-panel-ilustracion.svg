<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" fill="none" role="img" aria-label="Mapa ilustrado de centros de salud en Oaxaca">
  <defs>
    <!-- Fondo luminoso menta-crema cálido que resalta sobre el panel verde oscuro -->
    <linearGradient id="brightCanvas" x1="0" y1="0" x2="520" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4FBF7" />
      <stop offset="50%" stop-color="#E1F3EA" />
      <stop offset="100%" stop-color="#CBE8DA" />
    </linearGradient>

    <!-- Resplandor cálido dorado/coral suave para dar contraste y vida -->
    <radialGradient id="warmSunGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(410 48) rotate(90) scale(78)">
      <stop offset="0%" stop-color="#F6C482" stop-opacity="0.7" />
      <stop offset="55%" stop-color="#F3D5A8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E1F3EA" stop-opacity="0" />
    </radialGradient>

    <!-- Colinas verdes esmeralda y jade -->
    <linearGradient id="jadeHills" x1="260" y1="96" x2="260" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CC4A6" />
      <stop offset="100%" stop-color="#3F8E6F" />
    </linearGradient>

    <linearGradient id="emeraldWave" x1="0" y1="130" x2="520" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E6048" />
      <stop offset="55%" stop-color="#287A5C" />
      <stop offset="100%" stop-color="#154735" />
    </linearGradient>

    <!-- Pin principal en terracota/coral cálido que resalta con elegancia -->
    <linearGradient id="coralPin" x1="0" y1="-26" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E87A5D" />
      <stop offset="100%" stop-color="#C95B40" />
    </linearGradient>
  </defs>

  <!-- Lienzo claro y colorido -->
  <rect width="520" height="200" rx="12" fill="url(#brightCanvas)" />

  <!-- Cuadrícula cartográfica suave -->
  <g stroke="#287A5C" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="45" x2="520" y2="45" />
    <line x1="0" y1="90" x2="520" y2="90" />
    <line x1="0" y1="135" x2="520" y2="135" />
    <line x1="95" y1="0" x2="95" y2="200" />
    <line x1="195" y1="0" x2="195" y2="200" />
    <line x1="295" y1="0" x2="295" y2="200" />
    <line x1="395" y1="0" x2="395" y2="200" />
  </g>

  <!-- Sol cálido ámbar/dorado suave -->
  <circle cx="410" cy="48" r="76" fill="url(#warmSunGlow)" />
  <circle cx="410" cy="48" r="24" fill="#F5B971" fill-opacity="0.55" />
  <circle cx="410" cy="48" r="15" fill="#F2A452" fill-opacity="0.7" />

  <!-- Ondas de relieve / valles en verde menta y jade -->
  <path
    d="M0 128C68 96 142 104 218 122C294 140 364 98 446 110C478 115 502 122 520 128V200H0V128Z"
    fill="url(#jadeHills)"
    opacity="0.65"
  />
  <path
    d="M0 150C88 132 168 148 258 136C348 124 428 142 520 126V200H0V150Z"
    fill="url(#emeraldWave)"
  />

  <!-- Avenidas / Rutas estilizadas del mapa en blanco y dorado -->
  <path
    d="M36 168C124 122 190 108 260 94C334 80 398 86 484 54"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0.85"
  />
  <path
    d="M36 168C124 122 190 108 260 94C334 80 398 86 484 54"
    stroke="#287A5C"
    stroke-width="2"
    stroke-dasharray="5 5"
    stroke-linecap="round"
  />

  <!-- Círculo de cobertura alrededor del pin central -->
  <circle cx="260" cy="84" r="46" fill="#287A5C" fill-opacity="0.08" stroke="#287A5C" stroke-opacity="0.3" stroke-width="1.4" stroke-dasharray="4 4" />

  <!-- Pin izquierdo (Verde Esmeralda brillante) -->
  <g transform="translate(132, 112)">
    <ellipse cx="0" cy="16" rx="9" ry="3.5" fill="#001D14" fill-opacity="0.22" />
    <path
      d="M0 -16C-7.2 -16 -13 -10.2 -13 -3C-13 5.8 -2.3 13.6 -0.7 14.8C-0.3 15.1 0.3 15.1 0.7 14.8C2.3 13.6 13 5.8 13 -3C13 -10.2 7.2 -16 0 -16Z"
      fill="#1E6B50"
      stroke="#FFFFFF"
      stroke-width="2"
    />
    <circle cx="0" cy="-3" r="6.5" fill="#FFFFFF" />
    <path d="M0 -6V0M-3 -3H3" stroke="#103328" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Pin derecho (Ámbar / Dorado cálido) -->
  <g transform="translate(388, 74)">
    <ellipse cx="0" cy="16" rx="9" ry="3.5" fill="#001D14" fill-opacity="0.22" />
    <path
      d="M0 -16C-7.2 -16 -13 -10.2 -13 -3C-13 5.8 -2.3 13.6 -0.7 14.8C-0.3 15.1 0.3 15.1 0.7 14.8C2.3 13.6 13 5.8 13 -3C13 -10.2 7.2 -16 0 -16Z"
      fill="#E59A46"
      stroke="#FFFFFF"
      stroke-width="2"
    />
    <circle cx="0" cy="-3" r="6.5" fill="#FFFFFF" />
    <path d="M0 -6V0M-3 -3H3" stroke="#001D14" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Pin central principal (Terracota/Coral + Verde Bosque + Cruz médica) -->
  <g transform="translate(260, 76)">
    <ellipse cx="0" cy="24" rx="14" ry="4.5" fill="#001D14" fill-opacity="0.28" />
    <path
      d="M0 -24C-11 -24 -20 -15 -20 -4C-20 9.6 -3.6 21.6 -1.1 23.4C-0.4 23.9 0.4 23.9 1.1 23.4C3.6 21.6 20 9.6 20 -4C20 -15 11 -24 0 -24Z"
      fill="url(#coralPin)"
      stroke="#FFFFFF"
      stroke-width="2.4"
    />
    <circle cx="0" cy="-4" r="10.5" fill="#FFFFFF" />
    <path d="M0 -9V1M-5 -4H5" stroke="#103328" stroke-width="2.8" stroke-linecap="round" />
  </g>
</svg>

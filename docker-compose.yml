
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: puntoax_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_seguro
      POSTGRES_DB: puntoax_bd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  backend:
    build: ./backend  # Corregido: de ./back a ./backend
    container_name: puntoax_backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password_seguro
      - DB_NAME=puntoax_bd
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=password_seguro
      - PGDATABASE=puntoax_bd
      - PORT=3000
    depends_on:
      - db

  frontend:
    build: ./frontend # Corregido: de ./front a ./frontend
    container_name: puntoax_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
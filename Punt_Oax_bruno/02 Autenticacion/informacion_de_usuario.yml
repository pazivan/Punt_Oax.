info:
  name: informacion_de_usuario
  type: http
  seq: 15

http:
  method: GET
  url: '{{baseUrl}}/api/auth/perfil'
  auth:
    type: bearer
    token: '{{tokenSesion}}'

docs: |-
  Acepta cualquier rol. tokenSesion se actualiza con el último inicio de sesión. Devuelve el rol y la identidad autenticada, no el perfil de contacto completo.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

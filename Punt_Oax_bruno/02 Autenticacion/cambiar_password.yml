info:
  name: cambiar_password
  type: http
  seq: 16
http:
  method: PATCH
  url: '{{baseUrl}}/api/auth/cambiar-password'
  body:
    type: json
    data: |-
      { "passwordActual": "{{passwordActual}}", "passwordNueva": "{{passwordNueva}}" }
  auth:
    type: bearer
    token: '{{tokenSesion}}'

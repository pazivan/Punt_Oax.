info:
  name: restablecer_password
  type: http
  seq: 4
http:
  method: POST
  url: '{{baseUrl}}/api/auth/restablecer-password'
  body:
    type: json
    data: |-
      {
        "rol": "{{rolCorreo}}",
        "correo": "{{correoCuenta}}",
        "token": "{{tokenRecuperacion}}",
        "password": "{{passwordNueva}}"
      }
docs: |-
  Copia el token del enlace recibido, no el código de verificación. Cambia la contraseña y revoca las sesiones previas de esa cuenta.

info:
  name: solicitar_recuperacion
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/api/auth/solicitar-recuperacion'
  body:
    type: json
    data: |-
      { "rol": "{{rolCorreo}}", "correo": "{{correoCuenta}}" }
docs: |-
  rolCorreo: usuario, clinica o administrador. La respuesta no confirma la existencia de la cuenta.

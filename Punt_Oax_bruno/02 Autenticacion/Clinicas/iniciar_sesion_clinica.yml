info:
  name: iniciar_sesion_clinica
  type: http
  seq: 13

http:
  method: POST
  url: '{{baseUrl}}/api/auth/login-clinica'
  body:
    type: json
    data: |
      {
        "correo": "{{correoClinica}}",
        "password": "{{passwordClinica}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar('tokenClinica', res.status === 200 ? res.body?.token || '' : '');
        bru.setVar('tokenSesion', res.status === 200 ? res.body?.token || '' : '');
    - type: tests
      code: |-
        test('Acceso de clínica verificada', () => {
          expect(res.status).to.equal(200);
          expect(res.body.clinica.rol).to.equal('clinica');
          expect(res.body.token).to.be.a('string').and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

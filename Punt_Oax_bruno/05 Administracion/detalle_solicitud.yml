info:
  name: detalle_solicitud
  type: http
  seq: 2

http:
  method: GET
  url: '{{baseUrl}}/api/admin/solicitudes/{{idSolicitud}}'
  auth:
    type: bearer
    token: '{{tokenAdmin}}'
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const documento = res.body?.documentos?.[0];
          if (documento?.id_documento) bru.setVar('idDocumento', documento.id_documento);
        }
docs: |-
  Detalle de una solicitud: datos de la ficha enviada y documentos de la clínica. Guarda el primer idDocumento para descargarlo.

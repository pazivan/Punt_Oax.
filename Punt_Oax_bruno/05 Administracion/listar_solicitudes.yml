info:
  name: listar_solicitudes
  type: http
  seq: 1

http:
  method: GET
  url: '{{baseUrl}}/api/admin/solicitudes?estado=pendiente'
  auth:
    type: bearer
    token: '{{tokenAdmin}}'
docs: |-
  Lista postulaciones y actualizaciones. Filtros: estado=pendiente|aprobada|rechazada|todas. Selecciona explícitamente idSolicitud e idClinica; no se aprueba automáticamente la primera fila.

info:
  name: descargar_documento
  type: http
  seq: 5

http:
  method: GET
  url: '{{baseUrl}}/api/admin/documentos/{{idDocumento}}'
  auth:
    type: bearer
    token: '{{tokenAdmin}}'
docs: |-
  Descarga privada de un documento de postulación. Solo rol administrador. El idDocumento se obtiene del detalle de la solicitud. Si el archivo no existe responde 404.

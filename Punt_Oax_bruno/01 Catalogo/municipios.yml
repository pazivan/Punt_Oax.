info:
  name: municipios_oficiales_oaxaca
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/api/municipios'
runtime:
  scripts:
    - type: tests
      code: |-
        test('570 claves oficiales de Oaxaca', () => {
          expect(res.status).to.equal(200);
          const municipios = res.body.municipios;
          expect(municipios).to.have.length(570);
          expect(new Set(municipios.map(m => m.cvegeo)).size).to.equal(570);
          municipios.forEach(m => expect(m.cvegeo).to.match(/^20\d{3}$/));
          expect(municipios.filter(m => m.nombre === 'Oaxaca de Juárez')).to.have.length(1);
        });
docs: |-
  Catálogo público local. Selecciona municipioClave por su cvegeo; no conviertas las claves a números. Los municipios homónimos se distinguen por clave, no por nombre.

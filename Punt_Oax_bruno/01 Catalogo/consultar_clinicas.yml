info:
  name: consultar_clinicas
  type: http
  seq: 3

http:
  method: GET
  url: '{{baseUrl}}/api/clinicas'
  auth:
    type: bearer
    token: '{{tokenUsuario}}'
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.[0]?.id_clinica) bru.setVar('idClinica', res.body[0].id_clinica);
    - type: tests
      code: |-
        test('Catálogo autenticado', () => {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

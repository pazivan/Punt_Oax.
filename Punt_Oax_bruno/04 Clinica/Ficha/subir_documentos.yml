info:
  name: subir_documentos
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/api/clinicas/mi-ficha/documentos'
  body:
    type: multipart-form
    data:
      - name: documentos
        type: file
        value: []
  auth:
    type: bearer
    token: '{{tokenClinica}}'
docs: |-
  Selecciona un archivo en el campo documentos antes de enviar. PDF, PNG o JPG válidos; máximo 5 archivos de 5 MB cada uno en total. No incluyas Content-Type manualmente: Bruno define el boundary multipart.

info:
  name: consultar_datos_publicados
  type: http
  seq: 1

http:
  method: GET
  url: '{{baseUrl}}/api/clinicas/mi-ficha/datos-publicados'
  auth:
    type: bearer
    token: '{{tokenClinica}}'
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const servicio = res.body?.servicios?.[0];
          if (servicio?.id_servicio) bru.setVar('idServicioClinica', servicio.id_servicio);
        }
docs: |-
  Consulta datos y servicios de la propia clínica aprobada o suspendida. puede_editar_datos es verdadero solo para aprobadas. Guarda el primer id_servicio en idServicioClinica para el PATCH.
